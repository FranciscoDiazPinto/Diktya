<text x="38" y="1070" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="start" fill="#20333f">fin loop</text>
<rect x="60" y="1131" width="1380" height="65" rx="0" fill="#fff9e8" stroke="#20333f" stroke-width="2"/>
<text x="750" y="1159" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" text-anchor="middle" fill="#20333f">S02_3 registra también el resultado del lote sin falla; no repite el procesamiento.</text>
