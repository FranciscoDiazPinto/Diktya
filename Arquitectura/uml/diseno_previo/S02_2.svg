<text x="750" y="702" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" text-anchor="middle" fill="#20333f">Marcar fallo; detener nuevas filas y descartar trabajo aún no iniciado</text>
<rect x="60" y="775" width="1380" height="65" rx="0" fill="#fff9e8" stroke="#20333f" stroke-width="2"/>
<text x="750" y="803" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" text-anchor="middle" fill="#20333f">Ejecutar recuperación S02_3; este break impide continuar con la siguiente fila.</text>
