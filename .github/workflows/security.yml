name: seguridad
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.lock pytest pytest-asyncio
      - run: python -m pytest -q
      - run: node --test frontend/tests/*.test.mjs

  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit bandit
      - run: pip-audit -r netbot/requirements.lock --no-deps --disable-pip
      - run: bandit -q -r netbot/app --severity-level medium
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
